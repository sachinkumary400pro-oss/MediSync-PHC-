services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medisync_fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=MediSync PHC
      - VERSION=1.0.0
      - API_V1_STR=/api/v1
      - SECRET_KEY=medisync-tamilnadu-secure-production-jwt-key-change-in-prod
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - DATABASE_URL=postgresql://medisync:medisync_pass@db:5432/medisync_phc
      - ENABLE_SMS_MOCK=True
      - ENABLE_WHATSAPP_MOCK=True
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - medisync_data:/app/data

  db:
    image: postgres:16-alpine
    container_name: medisync_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=medisync
      - POSTGRES_PASSWORD=medisync_pass
      - POSTGRES_DB=medisync_phc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medisync -d medisync_phc"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  medisync_data:
  postgres_data:
